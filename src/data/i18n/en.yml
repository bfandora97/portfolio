utama:
  hero:
    label: Sales reports & dashboards for online sellers
    judul: See your real profit per channel, on one screen.
    isi: "I merge your online store, marketplace and POS exports into <b>1 report that updates itself</b>. Real profit per product and per channel, after fees. No more weekly copy-pasting."
    tombol:
      - {teks: Hire me on Upwork, link: upwork, kelas: btn}
      - {teks: Book a free 30-min call, link: booking, kelas: btn alt}
    harga: "From <b>{harga}</b> · delivered in {hari} days · 2 revisions"
    oleh: "Done by <b>Bobbi</b> myself · 4 years in data"
    animasi_alt: "Three-scene animation: a shop owner overwhelmed by sales data visits Bobbi and hands over the files, then Bobbi returns a report showing real profit per channel; the owner cheers and they shake hands."
    balon_masalah: "What is my real profit?"
    balon_hasil: "Now I know which channel earns the most!"
    adegan: [Messy data, Send it to me, Clear profit]
    tokoh_klien: Shop owner
    tokoh_bobbi: Bobbi · Kemang Data

  layanan_ringkas:
    judul: What I can do for you
    detail: "Details &rarr;"
    template_nama: Ready-made spreadsheet templates
    template_isi: Budget planner, profit calculator and more
    template_harga: Buy on Etsy

  masalah:
    anchor: problems
    judul: Problems I solve
    daftar:
      - {q: "I spend hours every week copying exports.", a: "Every channel lands in one dashboard that refreshes itself."}
      - {q: "Sales are up, but where does the money go?", a: "Profit per channel after platform fees and commissions."}
      - {q: "I don&rsquo;t know which products actually make money.", a: "Best sellers vs slow movers per product, on one screen."}
      - {q: "My customer list is a mess.", a: "One clean, deduplicated list, ready for email or SMS campaigns."}

  contoh:
    anchor: how
    judul: From messy exports to real profit
    lead: "Juniper Candle Co. sells on Shopify, Amazon, Etsy and at a weekend market. The shop and its numbers are fictional; the process is exactly what I do for you."
    hasil_anchor: examples
    hasil_judul: Example results
    alur: en_shop
    showcase:
      - judul: Automatic sales report
        gambar: /assets/img/umkm-sales-dashboard.png
        lebar: 1600
        tinggi: 1000
        alt: Example automatic sales dashboard for a fictional coffee shop
        link: /small-business-sales-dashboard.html
        link_teks: "See the full case study &rarr;"
        poin:
          - "<b>4-hour weekly recap &rarr; automatic.</b> The owner opens one link on their phone."
          - "<b>Delivery-app margin was only 41%</b>, vs 61% in store, once commissions were counted."
          - "<b>2 products were piling up stock</b> and were flagged to drop."
          - "<b>Busiest hours 3&ndash;6 pm</b>: the right time to add staff or run a promo."
      - judul: Customer data cleaned up
        gambar: /assets/img/contoh-rapikan-data.png
        lebar: 1280
        tinggi: 960
        alt: Example customer data before and after cleaning (fictional)
        link: ""
        link_teks: ""
        poin:
          - "<b>8 messy rows &rarr; 5 unique customers.</b> Duplicates removed."
          - "<b>Phone numbers standardized</b> to one international format."
          - "<b>Email typos fixed</b> (gmial, hotmial, .con) and city names unified."
          - "<b>A short report</b> listing everything that was fixed."

  jasa:
    anchor: services
    judul: "Services &amp; pricing"
    lead: "Fixed-price packages, 2 rounds of revisions included. Final scope and price are confirmed in writing before work starts."
    semua: "See all services &rarr;"
    tanya: "Ask on WhatsApp&nbsp;&rarr;"
    pesan_wa: "Hi Kemang Data, I am interested in the \"{nama}\" package (from {harga}). Could you tell me more?"

  proyek:
    judul: Projects
    lead: "Full case studies: the problem, what I did, and the result."

  template:
    judul: Ready-made templates
    lead: "Spreadsheet templates I build and sell on Etsy. Type in a few cells, the formulas do the rest. Instant download, secure checkout on Etsy."
    beli: "Buy on Etsy &rarr;"
    toko: "See all templates in my Etsy shop &rarr;"
    catatan: "Etsy is a trademark of Etsy, Inc. These templates are not created or endorsed by Etsy, Inc."

  cara_kerja:
    anchor: how-i-work
    judul: How it works
    lead: "Like ordering a coffee: you send, I prepare, you pick up."
    label_anda: You
    label_saya: Me
    live: "Demo pipeline last ran automatically:"
    langkah:
      - papan: Send data
        judul: Share your sales exports
        anda: "Send your POS, online store or marketplace exports. Not sure how? I will guide you."
        saya: Review the data and send a fixed quote (price &amp; deadline).
        waktu: "Day 1 · about 10 minutes of your time"
        link: ""
        link_teks: ""
      - papan: I clean it
        judul: Cleaned &amp; merged
        anda: Nothing.
        saya: Match product names, remove duplicates, apply fees and calculate real profit per channel.
        waktu: Days 2&ndash;4
        link: pipeline
        link_teks: "See the engine &rarr;"
      - papan: Report ready
        judul: Your report, on any device
        anda: Open one link, any time.
        saya: The report refreshes itself, and I walk you through how to read it.
        waktu: Day 5
        link: /small-business-sales-dashboard.html
        link_teks: "Example: Kopi Senja (fictional) &rarr;"
      - papan: Check &amp; pay
        judul: Revisions, then payment
        anda: Check the result, ask for changes, then approve.
        saya: 2 rounds of revisions included. Payment is held safely by Upwork until you approve.
        waktu: When you are happy
        link: ""
        link_teks: ""

  tentang:
    anchor: about
    judul: About
    foto_alt: Photo of Bobbi, founder of Kemang Data
    paragraf:
      - "Hi, I&rsquo;m <b>Bobbi</b>, founder of Kemang Data in Jakarta. For 4 years I have worked hands-on with data: merging records from different systems, cleaning messy data, building dashboards in Power BI and Looker Studio, and automating reports that used to be done by hand."
      - "What you can expect: a clear scope, fast and honest communication, and numbers you can trust. I do the work myself and reply to your messages myself."

  faq:
    judul: FAQ
    tanya:
      - {t: "How do we work together?", j: "Through Upwork. Fixed-price milestones, and your payment is held by Upwork until you approve the work. We talk in Upwork chat; calls can be arranged."}
      - {t: "What is your time zone?", j: "Jakarta, GMT+7. I reply within 24 hours on weekdays, usually much sooner. My working hours overlap with European afternoons and US East Coast mornings."}
      - {t: "Is my data safe?", j: "Yes. Your data is used only for your project, never shared, and deleted after delivery if you ask. I am happy to sign an NDA."}
      - {t: "Do I need to buy software?", j: "Not necessarily. Google Sheets and Looker Studio are free. Power BI is free to build in, but sharing reports privately usually needs a Power BI Pro licence."}
      - {t: "What if I need changes later?", j: "Every package includes 2 rounds of revisions. For ongoing updates, the monthly reporting plan keeps your dashboard current."}
