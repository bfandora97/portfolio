# Bagian halaman utama yang bentuknya sama di ID & EN (isi boleh beda per bahasa):
# cara kerja, FAQ, dan bagian kontak besar di bawah. Dipanggil dengan {{ cara_kerja() }}, {{ faq() }}, {{ kontak_utama() }}.
# Tombol: link (url / upwork / email / linkedin / github = dari site.yml) atau wa (isi pesan WhatsApp); kelas = btn big / btn / btn alt.

id:
  cara_kerja:
    anchor: cara-kerja
    judul: Cara kerja
    langkah:
      - {judul: Kirim contoh data, isi: "Chat WhatsApp, kirim 10&ndash;20 baris contoh (boleh disamarkan) dan ceritakan apa yang ingin dipantau."}
      - {judul: Estimasi gratis, isi: "Saya kirim lingkup kerja, harga, dan waktu secara tertulis. Tidak ada biaya sebelum Anda setuju."}
      - {judul: "Dikerjakan &amp; direvisi", isi: "Hasil dikirim sesuai jadwal, termasuk 2x revisi. Untuk dashboard, saya ajari cara pakainya."}
  faq:
    judul: Pertanyaan umum
    tanya:
      - {t: "Apakah data usaha saya aman?", j: "Ya. Data hanya dipakai untuk mengerjakan pesanan Anda, tidak dibagikan ke pihak lain, dan dihapus setelah proyek selesai kalau Anda minta. Saya mengikuti prinsip UU Pelindungan Data Pribadi."}
      - {t: "Saya tidak paham teknis. Apakah bisa?", j: "Bisa. Anda cukup cerita masalahnya dan kirim file yang biasa Anda pakai. Hasil akhirnya saya jelaskan dengan bahasa sederhana, dan dashboard bisa dibuka di HP."}
      - {t: "Perlu beli software?", j: "Tidak harus. Google Sheets dan Looker Studio gratis. Power BI hanya saya sarankan kalau tim Anda sudah memakainya."}
      - {t: "Bagaimana cara bayarnya?", j: "Transfer bank. Untuk proyek di atas Rp1 juta bisa DP 50% di awal dan pelunasan sebelum serah terima. Bisa juga lewat Fastwork atau Upwork."}
      - {t: "Kalau butuh tambahan di luar paket?", j: "Bisa. Saya sampaikan biaya dan waktunya dulu, dan dikerjakan setelah Anda setuju."}
  kontak:
    judul: Mau tahu untung sebenarnya dari tiap channel?
    lead: "Chat saja dan ceritakan usaha Anda. Kalau ada, kirim contoh laporan yang biasa Anda pakai. Saya balas dengan apa yang bisa dibuat, harga, dan lama pengerjaannya. Gratis, tanpa kewajiban."
    tombol:
      - {teks: Chat WhatsApp, wa: "Halo Kemang Data, saya mau konsultasi soal laporan penjualan usaha saya.", kelas: btn big}
      - {teks: Kirim email, link: email, kelas: btn}
      - {teks: LinkedIn, link: linkedin, kelas: btn alt}

en:
  cara_kerja:
    anchor: how-i-work
    judul: How I work
    langkah:
      - {judul: Share a sample, isi: "Send 10&ndash;20 rows of your data (anonymized is fine) and tell me what decisions it should support."}
      - {judul: Fixed quote in writing, isi: "You get the scope, price and deadline before anything starts. No surprises, no hourly creep."}
      - {judul: "Delivery &amp; revisions", isi: "Delivered on schedule with 2 rounds of revisions and a short walkthrough of how to use it."}
  faq:
    judul: FAQ
    tanya:
      - {t: "How do we work together?", j: "Through Upwork. Fixed-price milestones, and your payment is held by Upwork until you approve the work. We talk in Upwork chat; calls can be arranged."}
      - {t: "What is your time zone?", j: "Jakarta, GMT+7. I reply within 24 hours on weekdays, usually much sooner. My working hours overlap with European afternoons and US East Coast mornings."}
      - {t: "Is my data safe?", j: "Yes. Your data is used only for your project, never shared, and deleted after delivery if you ask. I am happy to sign an NDA."}
      - {t: "Do I need to buy software?", j: "Not necessarily. Google Sheets and Looker Studio are free. Power BI is free to build in, but sharing reports privately usually needs a Power BI Pro licence."}
      - {t: "What if I need changes later?", j: "Every package includes 2 rounds of revisions. For ongoing updates, the monthly reporting plan keeps your dashboard current."}
  kontak:
    judul: Need a dashboard or cleaner data?
    lead: "Send a sample of your data and what you want to track. I will tell you what I can build and how long it takes."
    tombol:
      - {teks: Upwork profile, link: upwork, kelas: btn big}
      - {teks: Email us, link: email, kelas: btn}
      - {teks: WhatsApp, wa: "Hi Kemang Data, I want to ask about a dashboard.", kelas: btn alt}
      - {teks: LinkedIn, link: linkedin, kelas: btn alt}
      - {teks: GitHub, link: github, kelas: btn alt}
