# Teks UI per bahasa: menu, footer, label tombol. Dipakai macro header() dan footer() di SEMUA halaman.
# Bahasa halaman diambil dari front matter `lang`. Jenis menu dari front matter `menu` (utama / kasus; default kasus).
#
# Item menu: teks, link, dan opsional:
# Urutan menu = urutan bagian di halaman. Desktop maks 5 link (+ Templates kalau ada produk).
#   hp: false        -> disembunyikan di layar HP (<= 520px). Aturan: di HP maksimal 3 link + tombol mode gelap.
#   kecil: false     -> disembunyikan di HP sangat kecil (<= 380px)
#   syarat: produk   -> hanya tampil kalau ada template Etsy yang live (src/data/produk.yml)
# Tombol ganti bahasa (EN / ID) dibuat otomatis dari `alternates` di front matter halaman.
# kasus: label + tombol kontak halaman studi kasus (layout kasus). link: upwork / email = ambil dari site.yml.

id:
  beranda: /
  mode_gelap: Ganti mode gelap
  bahasa_ini: Bahasa Indonesia
  label_bahasa: ID
  menu:
    utama:
      - {teks: Contoh, link: "#contoh"}
      - {teks: Jasa, link: "#jasa", hp: false}
      - {teks: Tentang, link: "#tentang", hp: false}
      - {teks: Kontak, link: "#contact", kecil: false}
    kasus:
      - {teks: Semua proyek, link: "/#projects"}
      - {teks: Kontak, link: "#contact", kecil: false}
  footer:
    tagline: "Satu laporan otomatis dari semua channel jualan. Untung per produk dan per channel langsung kelihatan, tanpa rekap manual."
    jelajahi: Jelajahi
    hubungi: Hubungi
    link:
      - {teks: Contoh hasil, link: "/#contoh"}
      - {teks: Jasa & harga, link: "/#jasa"}
      - {teks: Proyek, link: "/#projects"}
      - {teks: Cara kerja, link: "/#cara-kerja"}
      - {teks: Pertanyaan umum, link: "/#faq"}
    kontak: [whatsapp, email, linkedin]
    lokasi: Jakarta
  kasus:
    langkah: Langkah proyek
    layar_penuh: Layar penuh
    lightbox: [Dashboard layar penuh, Gambar sebelumnya, Gambar berikutnya, Tutup]
    tombol:
      - {teks: Hubungi Kemang Data, link: "/#contact", kelas: btn big}
      - {teks: Chat via WhatsApp, wa: "Halo Kemang Data, saya mau tanya soal dashboard penjualan.", kelas: btn alt}

en:
  beranda: /en/
  mode_gelap: Toggle dark mode
  bahasa_ini: English
  label_bahasa: EN
  menu:
    utama:
      - {teks: Services, link: "#services", hp: false}
      - {teks: Projects, link: "#projects"}
      - {teks: Templates, link: "#templates", hp: false, syarat: produk}
      - {teks: About, link: "#about", hp: false}
      - {teks: Contact, link: "#contact", kecil: false}
    kasus:
      - {teks: All projects, link: "/en/#projects"}
      - {teks: Contact, link: "#contact", kecil: false}
  footer:
    tagline: "One auto-updating report from all your sales channels. Real profit per product and per channel, no more copy-pasting exports."
    jelajahi: Explore
    hubungi: Contact
    link:
      - {teks: How it works, link: "/en/#how"}
      - {teks: Services & pricing, link: "/en/#services"}
      - {teks: Projects, link: "/en/#projects"}
      - {teks: Templates, link: "/en/#templates", syarat: produk}
      - {teks: FAQ, link: "/en/#faq"}
    kontak: [upwork, email, linkedin, github]
    lokasi: Jakarta, Indonesia
  kasus:
    langkah: Project steps
    layar_penuh: Full screen
    lightbox: [Full screen view, Previous image, Next image, Close]
    tombol:
      - {teks: Hire me on Upwork, link: upwork, kelas: btn big}
      - {teks: Email me, link: email, kelas: btn}
      - {teks: WhatsApp, wa: "Hi Kemang Data, I want to ask about a sales dashboard.", kelas: btn alt}
